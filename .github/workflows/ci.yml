name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: growthomic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build:packages

      - name: Linting
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit Tests (Shared, API, Worker, Web)
        run: pnpm -r test

      - name: DB Migrations Dry Run
        run: pnpm --filter @growthomic/db migrate
        env:
          DATABASE_URL_DIRECT: postgresql://postgres:password@localhost:5432/growthomic_test?sslmode=disable

      - name: RLS Tests
        run: pnpm --filter @growthomic/db test:rls
        env:
          DATABASE_URL_DIRECT: postgresql://postgres:password@localhost:5432/growthomic_test?sslmode=disable
